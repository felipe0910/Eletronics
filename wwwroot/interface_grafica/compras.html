  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="style/style-global.css" />
      <link rel="stylesheet" href="style/compras.css" />
      <script src="../interface_grafica/js/acessibilidade.js" defer></script>
      <script src="js/compras.js" defer></script>
      <title>Eletronics</title>
  </head>
  <body>

      <header class="main-header">
        <a href="index.html" class="logo-header">
          <img src="img/logo.png" alt="logo - eletronics story" />
        </a>

        <form action="/search" class="search-form">
          <label for="search-input" class="sr-only">Pesquisar</label>
          <input type="search" id="search-input" placeholder="Search" />
          <button type="submit">🔍</button>
        </form>

      <nav class="navegação">
  <ul>
    <li><a href="produtos.html?categoria=computadores">Computadores</a></li>
    <li><a href="produtos.html?categoria=notebooks">Notebook</a></li>
    <li><a href="produtos.html?categoria=smartphones">Smartphones</a></li>
    <li><a href="produtos.html?categoria=fones">Fones</a></li>
    <li><a href="pedidos.html">Meus pedidos</a></li>
  </ul>
</nav>

        <div class="user-actions">
          <a href="#" aria-label="carrinho de compras" class="icon-carrinho">
            <img src="img/carrinho.png" alt="" />
          </a>
          <button type="button" aria-label="conta" class="button-conta">
            <img src="img/user.png" alt="" />
          </button>
        </div>
      </header>

      <main>
          <section class="comprar">
            <div class="comprar__imagem">
              <img src="img/iPhone13pink.png" alt="Apple iPhone 14 Pro Max">
            </div>

            <div class="comprar__info">
              <div class="comprar__cabecalho">
                <h1 class="comprar__titulo"></h1>
                <p class="comprar__preco"></p>
              </div>

              <div class="comprar__descricao">
                <h3>Descrição</h3>
                <p class="comprar__descricao-texto">
                  </p>
              </div>

              <div class="comprar__endereco-container">
                <label for="txt-endereco" class="comprar__endereco-label">Endereço de Entrega</label>
                <input type="text" id="txt-endereco" class="comprar__endereco-input" placeholder="Ex: Rua das Flores, 123 - Centro" required />
              </div>

             <div style="margin-top: 24px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; width: 100%;">
  
  <span style="font-weight: 600; font-size: 1rem; color: #333; display: block;">
    Método de Pagamento
  </span>
  
  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px; width: 100%;">
    
    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: #333; cursor: pointer; padding: 2px 0;">
      <input type="radio" name="metodo-pagamento" value="pix" checked required style="accent-color: #001338; width: 18px; height: 18px; margin: 0; cursor: pointer;" /> 
      Pix (Aprovação imediata)
    </label>
    
    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: #333; cursor: pointer; padding: 2px 0;">
      <input type="radio" name="metodo-pagamento" value="cartao-credito" style="accent-color: #001338; width: 18px; height: 18px; margin: 0; cursor: pointer;" /> 
      Cartão de Crédito
    </label>
    
    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: #333; cursor: pointer; padding: 2px 0;">
      <input type="radio" name="metodo-pagamento" value="cartao-debito" style="accent-color: #001338; width: 18px; height: 18px; margin: 0; cursor: pointer;" /> 
      Cartão de Débito
    </label>

  </div>
</div>
              <button class="comprar__botao">Comprar</button>

              <div class="comprar__beneficios">
                <div class="beneficio">
                  <div class="beneficio__icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                  </div>
                  <div class="beneficio__texto">
                    <strong>Entrega Grátis</strong>
                    <span>1-2 dias</span>
                  </div>
                </div>

                <div class="beneficio">
                  <div class="beneficio__icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v11H3z"/><path d="M9 21V12h6v9"/></svg>
                  </div>
                  <div class="beneficio__texto">
                    <strong>Em Estoque</strong>
                    <span>Disponível</span>
                  </div>
                </div>

                <div class="beneficio">
                  <div class="beneficio__icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
                  </div>
                  <div class="beneficio__texto">
                    <strong>Garantia</strong>
                    <span>1 ano</span>
                  </div>
                </div>
              </div>
            </div>
          </section>
      </main>

      <footer>
          <img src="img/Social Icons.png" alt="">
          <img src="img/logo.png" alt="">
          <p>We are a residential interior design firm located in Portland. Our boutique-studio offers more than</p>
      </footer>

  </body>
  </html>
