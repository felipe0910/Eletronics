<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../interface_grafica/style/style-global.css" />
    <link rel="stylesheet" href="../interface_grafica/style/style-login-cadastro.css">
    <script src="/interface_grafica/js/search.js" defer></script>
    <title>Eletronics</title>

</head>
<body>

 <header class="main-header">
      <a href="index.html" class="logo-header">
        <img src="img/logo.png" alt="logo - eletronics story" />
      </a>

      <form action="produtos.html" method="get" class="search-form">
        <label for="search-input" class="sr-only">Pesquisar</label>
        <input type="search" id="search-input" name="q" placeholder="Search" />
        <button type="submit">🔍</button>
      </form>

<nav class="navegação">
  <ul>
    <li><a href="produtos.html?categoria=computadores">Computadores</a></li>
    <li><a href="produtos.html?categoria=notebooks">Notebook</a></li>
    <li><a href="produtos.html?categoria=smartphones">Smartphones</a></li>
    <li><a href="produtos.html?categoria=fones">Fones</a></li>
    <li><a href="pedidos.html">Meus pedidos</a></li>
  </ul>
</nav>

      <div class="user-actions">
        <a href="#" aria-label="carrinho de compras" class="icon-carrinho">
          <img src="img/carrinho.png" alt="" />
        </a>
        <button type="button" aria-label="conta" class="button-conta">
          <img src="img/user.png" alt="" />
        </button>
      </div>
    </header>


  <main class="login-wrapper">
        <section class="auth-card">
            <div class="auth-header">
                <img src="img/logo.png" alt="Logo">
                <h2>Bem-vindo</h2>
                <p>Acesse sua conta para continuar</p>
            </div>

        <form class="auth-form" id="form-login">
    <div class="input-group">
        <label>E-mail</label>
        <input type="email" name="email" id="email-input" placeholder="seu@email.com" required>
    </div>

    <div class="input-group">
        <label>Senha</label>
        <input type="password" name="senha" id="senha-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-auth">Entrar</button>
    
    <div class="auth-footer">
        <span>Não tem uma conta? <a href="tela-cadastro.html">Cadastre-se</a></span>
    </div>
    
    <div id="erro-msg" style="color: red; margin-top: 12px; display: none;"></div>
</form>

<script>
    // Fazer login assincronamente e salvar em localStorage
    const formLogin = document.getElementById('form-login');
    const erroMsg = document.getElementById('erro-msg');

    formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email-input').value.trim();
        const senha = document.getElementById('senha-input').value.trim();
        
        erroMsg.style.display = 'none';
        erroMsg.textContent = '';

        try {
            const formData = new FormData();
            formData.append('email', email);
            formData.append('senha', senha);

            const resp = await fetch('/login', {
                method: 'POST',
                body: formData
            });

            const data = await resp.json();

            if (!resp.ok) {
                erroMsg.textContent = data.erro || 'Erro ao fazer login.';
                erroMsg.style.display = 'block';
                return;
            }

            // Salvar usuário no localStorage
            if (data.id_usuario && data.nome) {
                localStorage.setItem('usuarioLogado', JSON.stringify({
                    id_usuario: data.id_usuario,
                    nome: data.nome,
                    email: data.email
                }));

                // Redirecionar para a página anterior (se houver) ou para home
                const params = new URLSearchParams(window.location.search);
                const returnUrl = params.get('returnUrl');
                
                if (returnUrl && (returnUrl.startsWith('/') || returnUrl.includes('interface_grafica'))) {
                    window.location.href = returnUrl;
                } else {
                    window.location.href = '/interface_grafica/home.html';
                }
            }
        } catch (erro) {
            console.error('Erro ao fazer login:', erro);
            erroMsg.textContent = 'Erro ao conectar com o servidor. Tente novamente.';
            erroMsg.style.display = 'block';
        }
    });
</script>
        </section>
    </main>





    <footer>
        <img src="img/Social Icons.png" alt="">
        <img src="img/logo.png" alt="">
        <p>We are a residential interior design firm located in Portland. Our boutique-studio offers more than</p>
      </footer>



    
</body>
</html>
